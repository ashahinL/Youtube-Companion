<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="extName">YouTube Companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <nav class="tabs" role="tablist">
      <button
        class="tab tab--active"
        id="tab-feeds"
        data-tab="feeds"
        data-i18n="tabFeeds"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="feeds"
        tabindex="0"
      >
        Feeds
      </button>
      <button
        class="tab"
        id="tab-watchlist"
        data-tab="watchlist"
        data-i18n="tabWatchlist"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="watchlist"
        tabindex="-1"
      >
        Watchlist
      </button>
      <button
        class="tab"
        id="tab-settings"
        data-tab="settings"
        data-i18n="tabSettings"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="settings"
        tabindex="-1"
      >
        Settings
      </button>
    </nav>

    <section id="feeds" class="panel" role="tabpanel" aria-labelledby="tab-feeds">
      <div class="feed-bar">
        <input
          id="feed-filter"
          class="add-row__input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Filter by title or channel"
          data-i18n-placeholder="feedFilterPlaceholder"
          aria-label="Filter by title or channel"
        />
        <button
          id="feed-refresh"
          class="icon-btn"
          type="button"
          aria-label="Refresh"
        >
          ↻
        </button>
        <span id="feed-refresh-spinner" class="spinner" hidden></span>
      </div>
      <p id="feed-last-poll" class="banner" hidden></p>
      <p id="feed-notice" class="banner" role="status" hidden></p>
      <div id="feed-list" class="list"></div>
      <div id="feed-empty-no-channels" class="empty">
        <p data-i18n="emptyFeeds">No channels yet</p>
        <button id="feed-goto-watchlist" class="btn btn--primary" type="button" data-i18n="feedEmptyAdd">
          Add a channel
        </button>
      </div>
      <div id="feed-empty-no-items" class="empty" hidden>
        <p data-i18n="emptyFeedWaiting">Nothing has arrived yet</p>
        <button id="feed-waiting-refresh" class="btn" type="button" data-i18n="feedRefresh">Refresh</button>
      </div>
      <div id="feed-empty-filter" class="empty" hidden>
        <p id="feed-filter-miss"></p>
        <button id="feed-filter-clear" class="btn" type="button" data-i18n="feedFilterClear">Clear filter</button>
      </div>
    </section>

    <section id="watchlist" class="panel" role="tabpanel" aria-labelledby="tab-watchlist" hidden>
      <form id="watchlist-add-form" class="add-row">
        <input
          id="watchlist-input"
          class="add-row__input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Channel URL, @handle, or name"
          data-i18n-placeholder="watchlistAddPlaceholder"
          aria-label="Channel URL, @handle, or name"
        />
        <button id="watchlist-add-btn" class="btn btn--primary" type="submit" data-i18n="watchlistAdd">
          Add
        </button>
        <span id="watchlist-spinner" class="spinner" hidden></span>
      </form>
      <p id="watchlist-error" class="banner banner--error" role="status" hidden></p>
      <div id="watchlist-results" class="list" hidden></div>
      <p id="watchlist-no-results" class="banner" data-i18n="watchlistNoResults" hidden>No channels found</p>
      <div id="watchlist-list" class="list"></div>
      <p id="watchlist-empty" class="empty" data-i18n="emptyWatchlist">Watchlist is empty</p>
    </section>

    <section id="settings" class="panel" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <p class="empty" data-i18n="emptySettings">No settings yet</p>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
