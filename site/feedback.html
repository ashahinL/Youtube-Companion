<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Send feedback — Companion for YouTube</title>
    <!-- Turnstile loads to stop spam. feedback.js posts the note. -->
    <style>
      :root {
        /* Without this the browser paints scrollbars and form controls for a
         * light page: a white bar down a dark one. */
        color-scheme: dark;
        --bg: #0f0f14;
        --surface: #17171f;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f1f1f4;
        --text-dim: rgba(241, 241, 244, 0.64);
        --accent: #7c5cf0;
        --accent-text: #a58cff;
        --on-accent: #ffffff;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #ffffff;
          --surface: #f6f6f8;
          --border: rgba(0, 0, 0, 0.12);
          --text: #16161a;
          --text-dim: rgba(22, 22, 26, 0.66);
          --accent: #6d4ae8;
          --accent-text: #5534d6;
          --on-accent: #ffffff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 400 15px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      a {
        color: var(--accent-text);
      }

      main {
        max-width: 560px;
        margin-inline: auto;
        padding-inline: 20px;
        padding-block: 56px 64px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 650;
        line-height: 1.25;
        text-wrap: balance;
      }

      p {
        margin: 0 0 16px;
      }

      .dim {
        color: var(--text-dim);
        font-size: 14px;
      }

      label[for='text'] {
        display: block;
        margin-block: 20px 6px;
        font-weight: 600;
      }

      textarea {
        width: 100%;
        min-height: 96px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        resize: vertical;
      }

      #challenge {
        margin-block-start: 16px;
      }

      button {
        margin-block: 16px 10px;
        padding-block: 10px;
        padding-inline: 18px;
        border: 0;
        border-radius: 9px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      #status:empty {
        margin: 0;
      }

      button:focus-visible,
      a:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .again {
        margin-block-start: 32px;
        padding-block-start: 16px;
        border-block-start: 1px solid var(--border);
      }

      .again a {
        display: block;
        margin-block-start: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <h1 data-text="feedbackTitle">Send feedback — Companion for YouTube</h1>
        <a id="switch-lang" href="?lang=ar" lang="ar" data-text="switchTo">العربية</a>
      </div>
      <p class="dim" data-text="feedbackLede">Tell us what works, what doesn't, or what you'd like next.</p>

      <form id="send-form" data-kind="feedback" novalidate>
        <label for="text" data-text="label">Your message</label>
        <textarea id="text" maxlength="2000" required></textarea>
        <div id="challenge"></div>
        <button type="submit" data-text="send" disabled>Send</button>
      </form>

      <p id="status" class="dim" role="status" aria-live="polite"></p>
      <p class="dim" data-text="sendNote">
        Only what you type is sent, with the extension's version and this page's language. No name, email or account is needed, and nothing else is kept. A Cloudflare check runs first to stop spam.
      </p>
    </main>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script src="feedback.js"></script>
  </body>
</html>
